# =============================================================================
# Bot Summon tuning. Read once at startup (no hot reload) from this file; a copy
# under data/solomapling/override/... wins over the packaged one.
#
# A bot summon is a real host Summon entity. A client animates only the summon it
# owns (the local player's own), so a bot's summon is moved by the SERVER: this
# plugin spells out the hover slot and broadcasts MOVE_SUMMON frames the way the
# client itself would (mirroring the pet system). STATIONARY summons (pirate
# turrets) are spawned in place and never moved.
# =============================================================================

enabled: true

# Spawn odds. Only an ambient bot whose job owns a summon (archer hawk, mage
# elemental, bishop bahamut, pirate turret, dark knight beholder) and is at least
# min_level rolls for one; a successful roll grants ONE summon. Persistent
# companions are never granted a summon (see BotSummonController).
spawn:
  chance: 0.55       # P(a summon appears) when the bot is eligible
  min_level: 70      # below this no summon is granted (matches 3rd-job summons)

# Server-driven movement for hovering summons (STATIONARY summons ignore this).
# A flying summon follows its owner the way a PET does: it holds a stable ring
# distance BEHIND the owner (a tight 10..22px flight ring, per summon, never
# re-rolled) and only swaps sides when the owner walks past it - so a turn in
# place never drags it around. The bird rides high (offset_y below) and carries
# a tiny sine bob; it glides toward that slot at a bounded speed, never
# warping. It always FACES the way its owner faces.
move:
  tick_ms: 300          # frame period: one MOVE_SUMMON per summon per tick
  offset_y: -65         # ride this far above the owner (negative = up)
  bob_x: 14             # horizontal bob amplitude (px)
  bob_y: 8              # vertical bob amplitude (px)
  follow_speed_x: 260   # bounded glide speed toward the slot (px/s)
  follow_speed_y: 300
  snap_distance: 900    # owner teleported? place the summon straight at its slot instead of creeping

# Attacking summons (turret / hawk / elemental / dragon / bahamut).
attack:
  # Pause after the summon's swing animation, before it may strike again. The full cooldown is the
  # summon's own attack1 length (600..2280ms, read from Skill.wz) PLUS this value, so a strike never
  # overlaps the previous swing. Floored at MIN_ATTACK_RECOVERY_MS = 2200 in the parser - a smaller
  # value here is raised, not honoured.
  recovery_ms: 2200
  range: 320         # it picks the nearest mob within this radius of itself

# Where a STATIONARY turret (the pirate octopus) is planted. A turret never moves, so a turret
# standing on an empty stretch of a hunting field is a turret that never fires - it is planted at
# a mob instead. Pure set dressing keeps the old rule: on a mobless map (a town) the turret lands
# at its owner's feet exactly as before.
place:
  at_mobs: true        # plant at a nearby mob; fall back to the owner's feet when none is in radius
  search_radius: 260   # how far from the BOT the target mob may sit (px)
  # A placed turret is re-seated at a fresh mob (near the owner, same search radius) once fewer
  # than relocate_min_mobs stay within its own attack range - the equivalent of a player recasting
  # their turret at the new pack. The probe runs at most once per relocate_after_ms, so a dry map
  # costs one range query per window, not one per tick.
  relocate_min_mobs: 1
  relocate_after_ms: 10000

# How long a summon lives. A player's summon is the skill's buff: the host timer cancels the
# SUMMON buffstat when the WZ buff time (octopus lv30: ~240s) runs out and the removal packet is
# what ends the entity. A bot's summon never registers that buff, so this plugin mirrors the
# rule itself - the summon expires on the same clock and the bot recasts, like a player does.
# Recasts are spread over refresh_window_ms (a player mashes the skill again sometime within the
# next few seconds, not on a stopwatch) and the granted skill level re-derives from the bot's
# current level, so a summon that comes back grows with its owner exactly as the first one did.
# The dark map / per-bot isolation rules of every other beat apply here too (see the follower).
lifetime:
  wz_duration: true    # false = the old rule: the summon outlives everything but its owner
  refresh_window_ms: 20000  # recast jitter: the next grant lands within this many ms after expiry
