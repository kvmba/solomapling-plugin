# =============================================================================
# Bot Pet Pool - pet item ids a SoloMapling bot may carry.
# =============================================================================
# Every entry must be a real pet item id (500xxxx); the loader validates with
# the host's ItemConstants.isPet() and silently drops anything else.
#
# Curated from String.wz/Pet.img.xml (v83). The two evolution "egg" items are
# intentionally excluded: 5000028 (Dragon) and 5000047 (Robo) — they are meant
# to be hatched into their evolved pet, and would render as an egg when worn.
#
# Add or remove ids freely; order does not matter.
# =============================================================================

