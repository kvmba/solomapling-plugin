# =============================================================================
# Bot Pet tuning. Read once at startup (no hot reload) from this file; a copy
# under data/solomapling/override/... wins over the packaged one.
# =============================================================================

enabled: true

# Carry chance = min(p_max, p_max * strength^exponent), where
#   strength = (1 - tier_weight) * level/level_cap + tier_weight * tierScore
#   tierScore: D=0.0  C=0.25  B=0.5  A=0.75  S=1.0
# So the ceiling is p_max (30%) and only high-level, high-tier bots approach it.
curve:
  p_max: 0.30
  level_cap: 120
  exponent: 1.4
  tier_weight: 0.25
  min_level: 10          # below this a bot carries no pet (newbie island)

# Count distribution, keyed on strength. The first band whose sMax exceeds the
# strength wins; w = per-mille weights for carrying 1, 2 or 3 pets.
counts:
  - { sMax: 0.25, w: [100, 0, 0] }
  - { sMax: 0.50, w: [80, 20, 0] }
  - { sMax: 0.75, w: [60, 32, 8] }
  - { sMax: 2.00, w: [45, 37, 18] }

# Pet level stays low on purpose: level 1 + floor(strength * per_strength), capped.
pet_level: { base: 1, per_strength: 4, max: 5 }

# Chance a newly granted pet is given a random name (and a name-tag).
naming: { chance: 0.70 }

# Pet looting gear (equip slot per pet index). A pet can loot only if the
# matching gear is equipped — exactly like a real client (host PetLootHandler).
gear:
  item_pouch:  { id: 1812001, chance: 0.60 }   # loots items
  meso_magnet: { id: 1812000, chance: 0.30 }   # loots mesos

# Follow drive. The pet walks (smooth velocity ramp) toward a point beside the bot
# (`speed` px/s, on land beside it and in water above it); it warps to the owner
# only when left hopelessly far behind (e.g. after a same-map teleport).
# It stands on the floor under its own x so it never floats over a ledge.
follow:
  tick_ms: 200
  swim_offset: 14

# Pet looting (only for pets with the matching gear). A pet picks up at most
# max_per_tick items per follow tick, and at most one every cooldown_ms — so it
# reads like a pet trotting over loot, not a vacuum. It only picks MONSTER
# drops (drops whose dropper is a mob), never a player-thrown item.
pickup:
  max_per_tick: 1
  range: 120
  cooldown_ms: 1000

# Pet behaviours. Each pet performs a command from its own WZ interact menu
# (Item.wz/Pet/<id>.img/interact) — the animation AND the spoken line come from
# the pet's data; the client resolves the line from String.wz/PetDialog.img
# (localized, so zh-CN pets speak Chinese). chance is the per-tick chance a pet
# does something; the interval is the per-pet cooldown after it does.
speak:
  chance: 0.25
  min_interval_ms: 8000
  max_interval_ms: 25000

# Persistent companions keep their pets across restarts (they are saved); ambient
# template bots keep theirs in memory only and never touch the DB.
persist:
  companions: true

