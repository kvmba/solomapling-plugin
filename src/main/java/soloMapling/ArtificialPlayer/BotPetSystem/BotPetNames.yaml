# =============================================================================
# Bot Pet Names - nicknames a NAMED bot pet may draw (the ~25% that get a name).
# =============================================================================
# Chinese nicknames, like the names a mainland player gives a real pet.
# Keep entries short (<= 7 chars; the client truncates longer pet names).
# Drawn without replacement; duplicates are dropped on load.
#
# A pet that is NOT named keeps its official default name instead (the item name
# from String.wz/Pet.img, e.g. "褐色小猫"), matching a fresh real pet.
# =============================================================================

