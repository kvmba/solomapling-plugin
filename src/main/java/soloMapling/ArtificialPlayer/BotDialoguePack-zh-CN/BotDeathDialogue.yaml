# Bot 死亡对话——任何类型的 bot 躺在地上时说的话。
# 不是某个 bot 类型的闲聊：死亡是通用行为，所以这个包保持通用，
# 由 BotDeath 直接读取（不走 bot 类型自己的 dialoguePath）。
#
# 两个互斥的池，按静态 WZ 数据（MapMobIndex）判定，不靠猜：
#   FieldDeath —— 这张图本来就定义会刷怪（MapMobIndex.level(mapId) >= 0）。
#                 bot 死在该死的地方：骂怪。
#   TownDeath  —— WZ 里这张图没有怪（level < 0），所以是有东西把怪带进来了：
#                 玩家引的、GM 刷的、召唤物。骂人。
#
# 上下文 token（DialogueContextResolver 解析，与其他包一致）：
#   {MOB} = 当前地图上的活体敌对怪，否则取该图定义会刷的怪
#   {MAP} = 地图名
# 带 token 的行都有纯文本兄弟行；token 解析失败时引擎会重抽纯文本行，
# 所以原始 {TOKEN} 永远不会漏到聊天里。
#
# 每个池的情绪分层（避免 120 条听起来像一个人念稿）：
# 甩锅 30% / 自嘲 25% / 喊冤 20% / 摆烂 15% / 放狠话 10%。
# 节点级 emote 是与抽中句子解耦的随机情绪盘。

BotDeath:

  # ── A. 野外死亡（这张图本来就该有怪）──────────────
  FieldDeath:
    text:
      # — 骂怪 —
      - {line: "{MOB}真把我打死了。我人傻了", emote: 5}
      - {line: "这只{MOB}是战犯 我要记下来", emote: 5}
      - {line: "{MOB}你个怂货 有种正面刚", emote: 5}
      - "我死了。被怪打死。在野外。谢谢大家关心"
      - {line: "谁来告诉{MOB}它不能这么干", emote: 4}
      - {line: "这只{MOB}凭什么这么强", emote: 5}
      - {line: "{MOB}绝对开挂了 没有别的解释", emote: 5}
      - {line: "我要跟{MOB}重赛 而且规则得按我的来", emote: 3}
      - {line: "{MOB}打我是用了全身重量吗", emote: 5}
      - "死于pve。连我都觉得丢人"
      - {line: "那只{MOB}一个暴击把我打进异次元", emote: 6}
      - {line: "{MOB}今天起床就决定要暴力", emote: 5}
      - {line: "客气地说 {MOB}可以去死了", emote: 5}
      - {line: "我不是输给{MOB} 我是被偷袭。性质不一样", emote: 3}
      - {line: "{MOB}就是运气好。就这一次。不会有第二次", emote: 3}
      - {line: "行吧{MOB} 这下真的过分了", emote: 5}
      - {line: "求求谁去削一下{MOB} 我跪着求", emote: 6}
      - {line: "那只{MOB}就是盯着我打。我感觉到了", emote: 5}
      - {line: "{MOB}看我剩5%血就往死里补刀", emote: 5}
      - {line: "{MOB}刚才干的这事是犯法的", emote: 5}
      - {line: "{MOB}我记住了。我不会原谅", emote: 3}
      - {line: "这只{MOB}自带主角光环 我服了", emote: 5}
      - {line: "{MOB}打人跟交了房租似的", emote: 5}
      - "这怪有剧情护甲 法官大人"
      - {line: "{MOB}连我药都不让喝完。没素质", emote: 5}
      - {line: "我要求{MOB}从游戏里删掉。联署在我简介", emote: 4}
      - {line: "那只{MOB}被我的点永久拉黑", emote: 5}
      - {line: "{MOB}打架下三滥 我有证人", emote: 5}
      - {line: "不是 凭什么{MOB}数值这么离谱", emote: 6}
      - {line: "{MOB}单挑敢不敢。不加血不带小弟", emote: 3}
      - {line: "那只{MOB}上我黑名单了。很短但很愤怒的那种", emote: 5}
      - {line: "{MOB}手真黑。可惜我是亲身体验到的", emote: 7}
      - {line: "我全怪{MOB}。全怪它", emote: 5}
      - {line: "{MOB}打得我经验条倒着走", emote: 6}

      # — 自嘲 / 认栽 —
      - "行吧这次是我的问题"
      - "我活该。真心话"
      - "我带着5%血就冲进去了。勇敢。愚蠢。但勇敢"
      - "我看见自己血量了。我还是选择暴力"
      - "我的药水键是装饰品显然"
      - "死于我所热爱的：不看血条"
      - "我就一个工作。按一下药水键。"
      - {line: "为我辩护一句 我确实没在防守", emote: 7}
      - "我贪了一下输出。就一下 人没了"
      - "切出去看别的就是这个下场"
      - "我忙着打字 没注意自己在死"
      - "我自己的问题。我知道。还是做了"
      - "我以为我能扛。我扛不住"
      - "自信害了我。这里自信的意思是蠢"
      - "我有药的。我有好多药。为什么啊"
      - "技术问题。纯粹的技术问题"
      - "我这是自找的 我认"
      - "这是一次经过认证的我式操作"
      - "我真以为我能赢。我不能"
      - "我忘了怪也会还手。好先进的概念"
      - "笔记：5%血不是满血"
      - "我把自己玩死了。完美。无可挑剔"
      - "我包里一直有药。我就是想试试"
      - "说实话？丢人。下一个问题"
      - "我分心了。分心什么？什么也没。更丢人了"
      - "这就是为什么朋友不让我单刷"
      - "我就是团灭的原因"
      - "我飘了。飘了就死了"
      - "我没死 我做了一个战略性的横躺决策"
      - "我尊重这只怪。我更恨我自己一点"

      # — 喊冤 / 不服 —
      - "我一秒前还是满血。发生了什么"
      - "这个伤害数字是假的。我看见了。它是假的"
      - "不是吧？？多少？？"
      - "不是 这一下比我一整条血还多"
      - "我想跟做数值平衡的人聊聊"
      - "这不是一次公平合理的交互"
      - "那个伤害数字是针对我的"
      - "我就转头看了一眼。就一眼"
      - "卡了。我怪网络。就是卡了"
      - "这一下隔着平台打到我。我看得清清楚楚"
      - "我明显在范围外。明显"
      - "我想申请这次死亡退款 谢谢"
      - "我的血条骗了我。我还信了它"
      - "接触伤害不是这么算的。我查过wiki"
      - "我要向上級申诉这次死亡"
      - "从概率上讲这不该打死我"
      - "我从没被一条血条背叛得这么彻底"
      - "那是暴击。一定那是暴击"
      - "我要求看回放。我要慢动作"
      - "谁来给我解释一下这怎么就把我打死了"
      - "这次死亡完全可以避免 我怪游戏"
      - "我的血从好好的直接没了 中间没有任何过程"
      - "服务器判定我死 那我还能说什么"

      # — 摆烂 —
      - "唉"
      - "行。死了。挺好的"
      - "好吧 事情就这么发生了"
      - "嗯。我在地上"
      - "死了。又死了。继续"
      - "没事。一切都很好"
      - "我接受了"
      - "躺平时间"
      - "我现在住这儿了。地上"
      - "谁去告诉我的刷怪点 它空了"
      - "看来我在休息了。永久的、非自愿的休息"
      - "我和地面正在互相了解"
      - "我想起来但地板其实挺舒服的"
      - "说实话这是我一整周休息最多的一次"
      - "有人找我就说我在横着"
      - "至少这图BGM还行"
      - "死了。但情绪稳定"
      - "我就躺一会儿。什么都不想"
      - "这基本就是个加了步骤的午睡"
      - "告诉我的{MOB}击杀数 我死在自己热爱的事上"

      # — 放狠话 —
      - {line: "我会回来找你的{MOB}。记住这话", emote: 3}
      - {line: "总有一天{MOB}。等我不是5%血的时候", emote: 3}
      - {line: "{MOB}最好睁一只眼睡觉", emote: 5}
      - {line: "我会回来的 而且这次带药", emote: 3}
      - {line: "等我起来 {MOB}就完了", emote: 5}
      - {line: "这事没完{MOB}。这只是个小睡", emote: 3}
      - {line: "我在恢复。先心理后生理。然后你就完了", emote: 3}
      - {line: "{MOB}趁现在得意 我马上满状态回来", emote: 5}
      - {line: "第二回合{MOB}。这次我带满血条", emote: 3}
      - {line: "留着吧{MOB} 我跟你没完", emote: 5}
      - {line: "我复活的时候会非常生{MOB}的气", emote: 5}
      - {line: "告诉{MOB} 我说它能跑但跑不掉", emote: 3}
    emote:
      - 5
      - 7
      - 4
      - 3
      - 6
    wait: 1

  # ── B. 城镇死亡（WZ 说这张图没怪——是有人把怪弄进来的）──
  TownDeath:
    text:
      # — 骂把怪弄进来的人 —
      - "谁把怪拉进城里的"
      - "这是安全区。安全。区"
      - "有人把这玩意儿引到城里了 我要名字"
      - "我死在城里了。城里。你们理解这有多丢人吗"
      - "城里是买东西的地方。你个祸害"
      - "谁把这东西拖进来的 祝你砸卷全碎"
      - "我是来买药的。买药。不是来送死的"
      - "这儿还有小孩呢。这里说的小孩就是我"
      - "有人故意引的。这不是意外 这是选择"
      - "我站在传送点上。传送点。好好的没惹谁"
      - "这是城镇广场不是boss竞技场"
      - "谁干这种事。谁把怪往城里带"
      - "我希望干这事的人踩到乐高"
      - "你把它带过来 现在我们一起遭殃"
      - "我要点名了。我真要点了。就是你"
      - "这是全游戏最安全的图 我死在这儿了"
      - "谁来给我解释一下{MAP}为什么有怪"
      - "我报名的是城里逛街 不是城里战斗"
      - "你引的 你负责清"
      - "我刚才在试帽子。帽子"
      - "旁边就是商店。为什么要在这儿打"
      - "这是商业区。请给点尊重"
      - "我来城里就是为了不死。整个计划就这个"
      - "干这事的人 我要发群里"
      - "这城现在有怪了。真好。真为我们高兴"
      - "我要跟把怪拉过来的人谈谈"

      # — 骂 GM / 管理 / 策划 —
      - "这绝对是GM干的"
      - "我要举报给管理。这不正常"
      - "GM刷的。GM刷的怪我死一次就能认出来"
      - "管理员出来解释。我等着"
      - "这是活动。很烂的活动。但确实是活动"
      - "有管理员权限的人在拿我们寻开心"
      - "我要正式投诉"
      - "策划。策划求你了。我在买东西啊"
      - "这明显是bug。我拒绝接受这次死亡"
      - "更新公告说城镇安全。公告骗人"
      - "我要精神损失赔偿"
      - "管理员滥用职权。纯纯的滥用职权"
      - "有刷怪指令的那位 权限该收回了"
      - "我要把这事写进工单。全部写进去"

      # — 自嘲 / 难以置信（城镇版）—
      - "死在城里。我的一世英名"
      - "我是第一个死在这儿的。我是先驱"
      - "我的墓碑要立在城镇广场"
      - "我死在了人生的新手教程里"
      - "所有地图里 我偏偏死在这儿"
      - "这次死亡我经济上永远恢复不了"
      - "连NPC都看见了。连NPC都看见了"
      - "商店老板看着我死的。他这辈子都不会让我忘"
      - "我现在是反面教材了。记住那个死在城里的人"
      - "这会进我的永久档案"
      - "我死在了一个大家专门去避难的地方"
      - "我朋友永远不会让我忘记这件事"
      - "我本来可以在野外死得体面些。不。我选了城里"
      - "历史级死亡。本地区最差"
      - "我已经到顶了。这就是我的巅峰。死在城里"
      - "谁截图一下 我以后好更难受"
      - "我甚至不生气。我只是非常丢人"
      - "我在逛街。逛街"
      - "死在一个叫安全区的地方 多讽刺"

      # — 喊冤 / 提要求 —
      - "这是虚假宣传。这图叫城镇"
      - "我要这次死亡的退款"
      - "我要那只怪被清掉 外加我的尊严被归还"
      - "谁来把它打死。它还在那儿"
      - "我死了它还溜达。干点什么啊"
      - "我要城卫兵。城卫兵在哪"
      - "为什么没有卫兵。这城没卫兵"
      - "我象征性地给这城交税了。保护我"
      - "我要记录在案：我死得不公平"
      - "这违反了好几条规定我确定"
      - "怪还在城里。没人管"
      - "我躺这儿都能看见它。它在嘲讽我"
      - "谁在我复活之前先把它解决了"
      - "我躺着呢 它就搁旁边散步。太嚣张了"
      - "至少有人道个歉吧"

      # — 摆烂（城镇版）—
      - "死在城里。行吧。为什么不呢"
      - "我现在住{MAP}了。住地上"
      - "谁从我身上跨过去吧 我不起来了"
      - "跟商店说我晚点到"
      - "我现在是城镇装饰的一部分了"
      - "这石板路意外的舒服"
      - "我想回家但我技术上已经在家了"
      - "行。我就死在城里。普通的周二"
      - "至少复活点很近"
      - "不等那东西走我就不起来"
      - "谁给我戴个帽子吧 我留下了"
      - "这是我的点了。地上那个点"
      - "我在{MAP}的地上。来找我"
      - "我就躺这儿 等那玩意儿消失"

      # — 放狠话（城镇版）—
      - "等我起来我要告诉所有人是谁干的"
      - "复活我就发帖"
      - "我要举报把怪引过来的人"
      - "有人要被点名了。公开点名"
      - "我会回来的 带着整个公会"
      - "这城不安全了 我要让所有人都知道"
      - "干这事的那位 我会去你店里。带着意见"
      - "我在记脸。所有人"
      - "我复活时带着怨气和一份名单"
      - "等我起来那只怪就完了。城里也不行"
      - "这条我要归档到我不会忘的事里"
      - "等我起来 {MAP}会收到一条非常响亮的差评"
      - {line: "我要把{MAP}写进遗嘱里。用很差的措辞", emote: 4}
      - {line: "{MOB}刚刚给自己制造了此生最强大的敌人", emote: 3}
      - "我复活之后要立刻让所有人都知道这事"
      - {line: "行了。{MOB}我要举报到大自然本身那里去", emote: 5}
      - {line: "我会在{MOB}得意完之前回来", emote: 3}
      - "谁把怪引到我身上的 你小心点"
      - {line: "这事我没完{MOB}。几个月。几年", emote: 3}
      - {line: "记下来：是{MOB}先动的手", emote: 5}
      - {line: "我复活时会很邪恶。是{MOB}逼的", emote: 5}
    emote:
      - 5
      - 4
      - 3
      - 6
      - 7
    wait: 1
