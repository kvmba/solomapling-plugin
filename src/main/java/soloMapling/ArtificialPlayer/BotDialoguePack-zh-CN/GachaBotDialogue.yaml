# 开盒诱饵机器人（GachaBot）的环境台词。它往地上撒一堆诱人的掉落物（偶尔一件被削废的"大奖"），
# 再走回去自己捡走，专门勾引旁观玩家抢先来抢、上当伸手。Taunt 是它干活时的一句挑衅：逗你、气你、
# 激你手快点来捡。只在部分轮次触发（见 GachaBot.maybeTaunt），不会刷屏。
# 切记不要把掉落物说成垃圾——它要的就是看起来值得一捡。
GachaBot:
  Taunt:
