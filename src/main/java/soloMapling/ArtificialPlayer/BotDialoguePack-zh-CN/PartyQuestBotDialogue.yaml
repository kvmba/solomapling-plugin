# 所有组队副本 bot 共用的等待区对白（LudiPQBot、KerningPQBot……）。
#
# 十六种副本 bot 都会向自己的 dialoguePath 索要同样的十二个节点，所以文案只写一份，
# 不在十六个文件里各抄一遍：BotDialogueHandler 按 root[botType][node] 取节点，故内容挂在
# `PartyQuestBot` 上，再用 alias 挂到每个具体类型下。改一行，所有副本 bot 同步生效。
#
# 节点覆盖面就是 PartyQuestBot 真正会索要的全部：
#   PartyAccept / PartyDecline  —— 回应招募喊话（PartyQuestBot.speakNode）
#   TradeDecline                —— 礼貌拒绝交易窗口（BotSM.tradeDeclineLine）
#   九个 SocialIntent 节点       —— 在等待区回应玩家搭话（BotSM.respondSocial）
#
# 前三个节点调用时 player 参数为 null，因此不带任何 {TOKEN}：解析不出的行会被整句丢弃，
# 若整池都解析不出，等待区就会彻底哑掉。社交节点总能拿到真实玩家，故可以有少量
# {PLAYER_NAME} / {PLAYER_LEVEL}。
