# 通用 TownWandererBot 环境对话（除射手村外各城漫游；射手村用单独打磨的 HenesysBot 台词）。
# 行里用 {MAP} 上下文 token，同一文件在废弃都市、魔法密林、勇士部落、林中之城、天空之城、玩具城、冰峰雪域都能读通。
# 台词保持城镇无关——不要写射手村专属梗。分城镇风味文件可之后用对话批处理 playbook 加。
#
# 这个 bot 的身份/作用：一个在城里闲逛的无聊真玩家——不练级、不摆摊，就是在公共场合待着。
# 它沿平台散步、偶尔溜达到相邻的城镇子图、发表情、给旁边升级的人道喜、自言自语。
# 下面这些台词要像一个真实冒险岛玩家在城里挂机时会甩出来的闲聊：瞎溜达、怀旧、现实生活中断、
# 抱怨掉率/卡顿/物价、逛自由市场、社交噪音、看别人、有一搭没一搭的练级计划、以及纯废话（哈哈、嗯、*打哈欠*）。
