# interested in the walk than the fight. Nodes:
#   GrindStart   — on engaging a hunting ground
#   GrindAmbient — idle muttering while it grinds (observed only)
#   MapTransition— on leaving a field for the next
# Context tokens ({MAP} {MOB} {REGION} {LEVEL}) are resolved live; a line whose tokens can't resolve falls
# back to a plain line. v83 client, no emoji. Lowercase, casual is the house style.
