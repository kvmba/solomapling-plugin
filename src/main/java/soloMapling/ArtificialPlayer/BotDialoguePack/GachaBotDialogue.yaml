# Ambient dialogue for the GachaBot - the bait bot. It sprays a tempting pile of loot on the ground
# (occasionally a gutted "jackpot"), then walks over and picks it back up, daring whoever is watching
# to grab it first. The Taunt node is its one-liner while it works the crowd: teasing, gloating and
# egging players on so they fall for it and reach in. Spoken on a fraction of sprays
# (see GachaBot.maybeTaunt), never a wall of text. Never call the drops junk - the whole point is
# that they look worth grabbing.
GachaBot:
