vehicle:
  # Aboard: played only while a participant is on a vehicle map (deck/car/cabin...); lines stay
  # agnostic to the specific ride. One pool serves every vehicle, so a line must NOT name one
  # (boat/train/plane/subway...), or it reads wrong on the others.
  - ["how long is this ride", "no idea, no rush though", "fair enough"]
  - ["wake me when we arrive", "relax, i barely sleep", "thanks"]
  - ["finally on our way", "my legs were done waiting", "same"]
  - ["i got a good seat", "the view's not bad", "worth it"]
  - ["how much further now", "still early i think", "alright"]
  - ["did you bring anything to eat", "a bit, want some", "you're the best"]
  - ["these seats are cramped", "it's not forever", "i guess"]
  - ["hope we're on time", "yeah, fingers crossed", "me too"]
  - ["this noise gets to me", "you get used to it", "do you though"]
  - ["i always fall asleep on these", "go ahead, i'll watch", "you're a hero"]
  - ["are we almost there", "looks close outside", "finally"]
  - ["last time this took ages", "don't remind me", "haha right"]
  - ["where are you headed", "the big city up ahead", "good, same route"]
  - ["nothing to do but sit", "we could just talk", "sure"]
  - ["i want to stretch my legs", "don't wander off", "fine, fine"]
  - ["should have left earlier", "we're fine still", "suppose so"]
  - ["grab your bags when we stop", "almost forgot, thanks", "no problem"]
  - ["how much longer do you think", "a nap and we're there", "then i'll nap"]
  - ["not many people today", "lucky us", "nice"]
  - ["the view keeps changing fast", "we're moving quick", "i can tell"]
  - ["bit of a jolt, you okay", "used to it, i'm fine", "good"]
  - ["good to finally sit", "standing is rough", "tell me about it"]
  - ["let's grab food when we stop", "count me in", "done"]
  - ["this went faster than i thought", "even better", "yeah"]
