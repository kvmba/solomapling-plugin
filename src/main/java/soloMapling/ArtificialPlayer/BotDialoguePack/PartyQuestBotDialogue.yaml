# Shared lobby pack for every party-quest bot (LudiPQBot, KerningPQBot, ...).
#
# All sixteen PQ types ask their own `dialoguePath` for the same twelve nodes, so the lines
# live here ONCE rather than sixteen times. `BotDialogueHandler` looks a node up as
# root[botType][node], so the content is anchored on `PartyQuestBot` and aliased onto each
# concrete type below - editing a line here changes it for every PQ bot.
#
# Node coverage is exactly what a PartyQuestBot can ask for:
#   PartyAccept / PartyDecline  - answering a recruit shout (PartyQuestBot.speakNode)
#   TradeDecline                - politely refusing a trade window (BotSM.tradeDeclineLine)
#   the nine SocialIntent nodes - answering a player's chat in the lobby (BotSM.respondSocial)
#
# PartyAccept/PartyDecline/TradeDecline are spoken with the PLAYER argument null, so those
# three nodes carry no {TOKEN}s: a token that cannot resolve drops the line, and a lobby whose
# whole pool failed to resolve would go silent. The social nodes are always reached with a real
# player, so a few of their lines may use {PLAYER_NAME} / {PLAYER_LEVEL}.
