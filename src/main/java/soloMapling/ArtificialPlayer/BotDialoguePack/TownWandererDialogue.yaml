# Shared ambient dialogue for the generic TownWandererBot (roams every town except Henesys, which keeps
# its hand-polished HenesysBot lines). Lines use the {MAP} context token so the same file reads correctly
# in Kerning, Ellinia, Perion, Sleepywood, Orbis, Ludibrium, El Nath. Keep lines town-agnostic — no
# Henesys-specific references. Per-town flavor files can come later via the dialogue batch playbook.
#
# Identity / role of this bot: a bored real player idling in town — not training, not trading, just
# existing in public. It strolls ledges, drifts to a neighbouring town sub-map, emotes, congratulates
# anyone who dings nearby, and mutters to itself. The lines below are written to sound like the small
# talk actual MapleStory players leave in a town square: aimless strolling, nostalgia, real-life
# interruptions, gripes about drops/lag/prices, Free Market window-shopping, "who's online" social
# noise, people-watching, half-hearted training plans, and pure filler ("lol", "hm", "*yawn*").
#
# v83 client, no emoji — keep every line short. Lowercase, casual, typo-friendly is the house style.
TownWandererBot:
  # Cheering a nearby character who just dinged (player OR bot). Fired by LevelUpCongrats.
  CongratsLevelUp:
    text:
      - "gratz {PLAYER_NAME}!"
      - "nice, level {PLAYER_LEVEL}"
      - "gz gz"
      - "ayy congrats {PLAYER_NAME}"
      - "lv {PLAYER_LEVEL} already? nice"
      - "keep grinding {PLAYER_NAME}"
      - "wtg"
      - "grats on the level up"
      - "nice one {PLAYER_NAME}"
      - "oh a level up, gratz {PLAYER_NAME}"
      - "lets go {PLAYER_NAME}"
      - "level {PLAYER_LEVEL}, not bad"
      - "gz {PLAYER_NAME}, keep it up"
      - "nice climb to {PLAYER_LEVEL}"
      - "there we go, gratz"
      - "woo {PLAYER_NAME}!"
      - "another one down, grats"
      - "gz! how long did {PLAYER_LEVEL} take"
      - "level up gang"
      - "nice, one step closer"
      - "grats grats, onto the next"
      - "saw the ding, gz {PLAYER_NAME}"
      - "clean level up"
      - "big gz"
      - "finally huh, congrats"
      - "that was fast, gz"
      - "gz {PLAYER_NAME}, now dont die"
      - "level up and a half"
      - "congrats! dinner on you"
      - "mvp grind"
      - "gz, jealous of that leveling speed"
      - "keep that pace {PLAYER_NAME}"
      - "there it is, {PLAYER_LEVEL}"
      - "nice ding"
      - "gz, you're catching up to me"
      - "that one felt good huh"
      - "gratz, save some levels for us"
      - "gz! onto {PLAYER_LEVEL} then more"
      - "leveling machine over here"
      - "grats {PLAYER_NAME}, well earned"

