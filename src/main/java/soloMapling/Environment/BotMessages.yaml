# Player-visible UI strings that live in Java code rather than in a BotDialoguePack YAML.
#
# Every string a player can see that is NOT spoken as bot dialogue belongs here: system
# notices (party declined), trade-chat lines, hint balloons (option menus), yellow
# messages, and chalkboards. Bot dialogue lines stay in BotDialoguePack*.
#
# Resolution: BotMessages-<tag>.yaml first, then this file (see LocalizedResources).
# A key missing from the localized copy silently falls back to the English value here,
# so adding a key to this file is always safe.
#
# Placeholders are {0}, {1}, ... and are substituted positionally by BotMessages.get().
# Keep the placeholder count/order identical across translations.

# ---------------------------------------------------------------------------
# Party
# ---------------------------------------------------------------------------
party.declined: "{0} has declined your party request."
party.join_failed: "{0} couldn't join your party (it was full or disbanded) - try inviting again."

# ---------------------------------------------------------------------------
# Option menus (labels shown in the hint balloon)
#
# NOTE: the labels below are display-only. Each menu also carries keyword lists in
# BotMessages.keywords() which are matched against what the player types; a localized
# label must always ship with a matching localized keyword list, or a player who sees
# the Chinese menu still has to type English to answer it.
# ---------------------------------------------------------------------------
menu.training_solo.training: "How's the training?"
menu.training_solo.party: "Wanna party up?"
menu.training_solo.goodbye: "Goodbye"

menu.training_party.training: "How's the training?"
menu.training_party.follow: "Follow me!"
menu.training_party.goodbye: "Goodbye"

menu.follower.train: "Train here with me!"
menu.follower.nevermind: "Nevermind"

menu.social.whatsup: "What's up?"
menu.social.interesting: "Anything interesting?"
menu.social.rumors: "Any rumors?"
menu.social.teamup: "Wanna team up?"
menu.social.goodbye: "Goodbye"

# Extra typeable aliases for the social menu, mirroring the zh-CN pack. The English keywords
# passed to BotMessages.keywords() and the localized label text are matched too; these lists only
# add phrasings worth accepting. Lists are per-language overrides, not merges, so each pack that
# defines them should stand on its own.
menu.social.whatsup.keywords:
  - ["whats up", "sup", "how's it going", "hows it going"]
menu.social.interesting.keywords:
  - ["anything", "news", "happening"]
menu.social.rumors.keywords:
  - ["rumor", "rumour", "gossip", "heard"]
menu.social.teamup.keywords:
  - ["team", "party", "group"]
menu.social.goodbye.keywords:
  - ["bye", "goodbye", "cya", "later"]

