menu.social.interesting: "有啥新鲜事？"
menu.social.rumors: "有啥传闻？"
menu.social.teamup: "要组队吗？"
menu.social.goodbye: "再见"

# Extra typeable aliases for the social menu. The English keywords and the localized label text
# are matched too; these cover the phrasings a Chinese-speaking player actually types.
