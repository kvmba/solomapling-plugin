pq.chat.HorntailPQ.working.12: "五把钥匙没有捷径，磨就完了。"
pq.chat.HorntailPQ.working.13: "龙感觉到了，让它感觉。"
pq.chat.HorntailPQ.working.14: "这间的门要用对应的钥匙。"
pq.chat.HorntailPQ.working.15: "守护者出手重，药备好！"
