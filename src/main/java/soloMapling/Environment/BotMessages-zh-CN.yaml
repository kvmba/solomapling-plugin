# ---------------------------------------------------------------------------
# Option menus (labels shown in the hint balloon)
#
# IMPORTANT: these labels are display-only. The keywords a player can type live in
# BotMessages.keywords() and are seeded from the ENGLISH labels plus the localized ones
# below, so a player may answer with either language. Keep these short: the hint balloon
# renders one option per line and long lines get clipped by the client.
# ---------------------------------------------------------------------------
menu.training_solo.training: "练得怎么样？"
menu.training_solo.party: "要组队吗？"
menu.training_solo.goodbye: "再见"

menu.training_party.training: "练得怎么样？"
menu.training_party.follow: "跟我来！"
menu.training_party.goodbye: "再见"

# Extra typeable aliases for the training menu's party option.
#
# The English keywords in TrainingBot ("party"/"team"/"join") are always matched, so this list
# only ADDS phrasings - it is not a replacement. It exists because the English list is not
# transliterated: without it a player reading "要组队吗？" has to answer in English, and the
# label alone ("要组队吗", derived from the label text) only matches when that exact phrase is
# typed.
#
# Keep these narrow enough not to hijack the neighbouring options: BotOptionMenu.match() walks
# the options IN ORDER, so an alias that also appears in "training" or "goodbye" would win or
# lose on ordering rather than on meaning.
menu.training_solo.party.keywords:
  - ["组队", "组我", "带我", "一起", "上车", "刷怪"]

# Extra typeable aliases for the training menu's follow option ("跟我来！").
#
# Same reasoning as the party list above: the English keywords in TrainingBot
# ("follow"/"come"/"lead") are always matched, but they are not transliterated, and the label
# alone ("跟我来") only matches when that exact phrase is typed. "跟我走" - the wording a
# Chinese-speaking player reaches for first - missed entirely before this list existed.
#
# Keep these narrow: BotOptionMenu.match() walks the options IN ORDER with contains(), so an
# alias that also appears in "练得怎么样？" or "再见" would win or lose on ordering rather than
# on meaning. Two characters minimum - a bare "走"/"来" would swallow half the chat.
menu.training_party.follow.keywords:
  - ["跟我走", "跟着我", "跟我来", "跟我", "跟着", "跟上", "跟紧我",
     "走这边", "来这边", "过来", "过来这边", "带路", "一起走", "我带你"]

menu.follower.train: "在这儿陪我练！"
menu.follower.nevermind: "没事了"

# Typeable aliases for the follower menu's "在这儿陪我练！" option, mirroring the en-US pack.
#
# The English keywords in FollowerBot ("train"/"grind"/"station") are always matched and the
# label alone only matches that exact phrase, so "开打" - the wording a Chinese player actually
# types to mean "start grinding right here" - used to do nothing at all.
#
# Two characters minimum and no bare filler: match() is contains-based and walks options IN ORDER,
# so a lone "这里" ("我这里有个东西") or "升级" ("我升级了") would fire the menu on ordinary
# party chat. Only phrasings where the spot or the fighting is the actual point are listed.
menu.follower.train.keywords:
  - ["开打", "开干", "开始打", "开始练", "开练", "开刷",
     "杀怪", "打怪", "刷怪", "练级", "打怪升级", "在这升级",
     "就这里", "就这儿", "就这", "在这里打", "在这打", "在这儿打",
     "这里练", "这儿练", "这练", "在这儿练", "在这儿", "在这练", "就这练", "就地练",
     "留这儿", "留这里", "别走了", "停这", "停下", "站住"]

