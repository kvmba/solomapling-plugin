# =============================================================================
# Rare / iconic equip override prices
# =============================================================================
# The Free Market prices most gear from its WZ "price" field (x a job-style
# multiplier). WZ price is a *shop resale* number, not a market value, so the
# most sought-after gear in the game carried a small WZ price and listed for
# less than junk: a Lv70 Maple weapon at ~0.5m while generic gear of the same
# slot listed for 4m.
#
# This table overrides that for genuinely rare / iconic gear. Values are in
# mesos and follow 国服 v83 economy conventions: boss-unique / top-BIS pieces
# are worth tens to hundreds of times an ordinary shop equip (ordinary Lv70
# gear sits near 0.5-1m), topping out below the 2.147b int cap.
#
# HOW IT IS APPLIED
#   - EquipListGenerator.applyRarePriceOverride, on both pricing paths, as a
#     FLOOR: a genuinely higher scrolled valuation is preserved.
#   - An entry only bites if the item can reach a shelf. So every id here is
#     tradeable (UNTradeable/quest/cash gear is excluded from shops by the game)
#     and either sits in a class YAML pool or is listed in desirableEquips.yaml
#     (whose whitelist bypasses the level / price filters). Entries whose equip
#     *slot* is never generated by a shop (mace / knuckle / pistol - no shop
#     draws those) are deliberately omitted.
#
# Values are human-curated estimates meant to be tuned. Edit freely - the loader
# needs no code change and re-reads on the next startup.
#
# Format:  <item id>: <price in mesos>   # name
# Anything not listed here prices exactly as before.
# =============================================================================

