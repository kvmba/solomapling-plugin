# =============================================================================
# Rare / iconic equip override prices
# =============================================================================
# The Free Market prices most gear from its WZ "price" field (x a job-style
# multiplier). WZ price is a *shop resale* number, not a market value, so the
# most sought-after gear in the game carries a small WZ price and ended up on
# the shelf for less than junk: a Zakum Helmet listed for ~1m while an ordinary
# Lv70 weapon listed for 4m.
#
# This table overrides that for genuinely rare / best-in-slot gear. Values are
# in mesos and follow 国服 (ChinaMS) v83 market conventions: BOSS-unique and
# top BIS pieces are worth tens to hundreds of times an ordinary shop equip
# (common Lv70 gear sits around 0.5-1m), topping out below the 2.147b int cap.
# They are deliberately human-curated and meant to be tuned - edit freely, the
# loader needs no code change.
#
# Format:  <item id>: <price in mesos>   # name
# Anything not listed here prices exactly as before.
# =============================================================================

