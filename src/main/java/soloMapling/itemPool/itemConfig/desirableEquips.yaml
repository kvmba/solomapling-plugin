# Desirable Equips Whitelist
# Items on this list bypass the price floor and level-band filters in generateEquipListIIPU.
# Untradeable and quest items are ALWAYS filtered out regardless of this list.
#
# Format: category name -> list of item IDs
# Organize by whatever grouping makes sense (class, slot, theme, etc.)
# Add items here that are low-level or low WZ-price but still desirable (BIS, rare, iconic).
#
# Pair these with a market price in rareItemPrices.yaml: whitelisting lets the
# item reach a shelf at all, the price table decides it does not list for peanuts.
#
# Note: an item still needs its equip *slot* to be generated by the shop job.
# Capes only come from Common shops; wands/staves only from Mage shops, etc.

